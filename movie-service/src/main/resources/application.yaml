server:
  port: 8081
  servlet:
    context-path: /movies

spring:
  application.name: movie-service
  mongodb:
    uri: ${MONGO_ATLAS_URI}
    database: sample_mflix
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs